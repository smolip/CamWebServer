server {
    listen 80;
    server_name budka.smolikovic.cz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name budka.smolikovic.cz;

    ssl_certificate     /etc/letsencrypt/live/budka.smolikovic.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/budka.smolikovic.cz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location /live/ {
        proxy_pass         http://10.182.35.3:8888/;
        proxy_redirect     /cam/ /live/cam/;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass       http://10.182.35.3:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
