server {
    listen 80;
    server_name _;  # nebo tvoje doména: server_name kamera.priklad.cz;

    # HLS stream přímo z MediaMTX na RPi (přes WireGuard)
    location /live/ {
        proxy_pass         http://RPI_WG_IP:8888/;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
    }

    # Záznamy z RPi
    location /recordings/ {
        proxy_pass http://RPI_WG_IP/recordings/;
    }

    # Všechno ostatní (web UI, API, login) → RPi nginx přes WireGuard
    location / {
        proxy_pass       http://RPI_WG_IP:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
