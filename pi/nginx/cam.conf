server {
    listen 8080;

    # Statické soubory (CSS, JS)
    location /static/ {
        alias /home/pi/cam/static/;
        expires 1h;
    }

    # HLS stream z MediaMTX
    location /live/ {
        proxy_pass         http://127.0.0.1:8888/;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
    }

    # Soubory záznamů — nginx je servuje přímo (efektivnější než Flask)
    location /recordings/ {
        alias /home/pi/recordings/;
        add_header Content-Disposition 'inline';
    }

    # ESP32 webhooky — povoleno pouze z lokální sítě
    location ~ ^/(motion|idle)$ {
        allow 192.168.1.0/24;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:5000;
    }

    # Vše ostatní → Flask
    location / {
        proxy_pass       http://127.0.0.1:5000;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
    }
}
