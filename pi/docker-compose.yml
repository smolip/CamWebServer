services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    ports:
      - "8554:8554"
    volumes:
      - ./docker/mediamtx.yml:/mediamtx.yml:ro
      - ./recordings:/recordings

  cam-app:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - CAM_SECRET_KEY=${CAM_SECRET_KEY}
      - CAM_USER=${CAM_USER}
      - CAM_HASH=${CAM_HASH}
      - ESP32_IP=${ESP32_IP}
      - MEDIAMTX_HOST=mediamtx
      - RECS_DIR=/recordings
    volumes:
      - ./recordings:/recordings:ro
    depends_on:
      - mediamtx
