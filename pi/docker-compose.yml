services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    ports:
      - "8554:8554"   # RTSP (ffmpeg pushuje sem z cam-app)
    volumes:
      - ./docker/mediamtx.yml:/mediamtx.yml:ro
      - /home/pi/recordings:/recordings

  cam-app:
    build: .
    restart: unless-stopped
    environment:
      - CAM_SECRET_KEY=${CAM_SECRET_KEY}
      - CAM_USER=${CAM_USER}
      - CAM_HASH=${CAM_HASH}
      - ESP32_IP=${ESP32_IP}
      - MEDIAMTX_HOST=mediamtx
      - RECS_DIR=/recordings
      - DATABASE=/data/cam.db
    volumes:
      - /home/pi/recordings:/recordings:ro
      - cam-data:/data
    depends_on:
      - mediamtx

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/static:ro
      - /home/pi/recordings:/recordings:ro
    depends_on:
      - cam-app
      - mediamtx

volumes:
  cam-data:
